---
name: Package Validation

'on':
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Build packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Go version
        id: go-version
        shell: bash
        run: |
          go_version="$(sed -n 's/^go \([0-9][0-9.]*\)[[:space:]]*$/\1/p' go.mod)"
          test -n "$go_version"
          echo "range=~$go_version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          cache: true
          go-version: ${{ steps.go-version.outputs.range }}
          check-latest: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Install packaging tools
        shell: bash
        run: |
          sudo ./packaging/apt-get-retry.sh update
          sudo DEBIAN_FRONTEND=noninteractive ./packaging/apt-get-retry.sh install \
            -y --no-install-recommends rpm

      - name: Build Debian packages
        run: |
          PACKAGING_FORCE_DIRECT_DEB=1 \
          PACKAGING_SKIP_SIGN=1 \
          PACKAGING_SKIP_NATIVE_TESTS=1 \
            ./packaging/build-deb.sh

      - name: Build RPM packages
        run: |
          PACKAGING_LINUX_MACROS=1 \
          PACKAGING_SKIP_BUILDDEPS=1 \
          PACKAGING_SKIP_SIGN=1 \
          PACKAGING_SKIP_NATIVE_TESTS=1 \
            ./packaging/build-rpm.sh

      - name: Verify package payloads
        shell: bash
        run: |
          mapfile -t artifacts < <(
            find out/packages -type f \( -name '*.deb' -o -name '*.rpm' \) |
              LC_ALL=C sort
          )
          ./packaging/verify-release-assets.sh "${artifacts[@]}"

  release-archives:
    name: Build release archives
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Go version
        id: go-version
        shell: bash
        run: |
          go_version="$(sed -n 's/^go \([0-9][0-9.]*\)[[:space:]]*$/\1/p' go.mod)"
          test -n "$go_version"
          echo "range=~$go_version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          cache: true
          go-version: ${{ steps.go-version.outputs.range }}
          check-latest: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Build cross-platform release archives
        run: |
          PACKAGING_SKIP_SIGN=1 \
          RELEASE_SKIP_PACKAGES=1 \
            ./packaging/build-release-assets.sh

      - name: Verify release archive contents
        shell: bash
        run: ./packaging/verify-release-assets.sh out/release/*.tar.gz out/release/*.zip
